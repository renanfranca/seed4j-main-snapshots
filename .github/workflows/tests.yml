name: tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e7ec0987d4d385822f2d6bdb709d55dc34
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762e64cced70ee4eb10dc5218ea3b0e3cf89e
        with:
          node-version: 24.12.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274d780752246b4c7e1e55e87e80049035ac2
        with:
          distribution: temurin
          java-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Run behavior tests
        run: npm test

      - name: Check formatting
        run: npm run prettier:check

      - name: Verify pinned Maven runtime
        run: ./mvnw --version

      - name: Run credential-free publisher dry run
        run: npm run dry-run
